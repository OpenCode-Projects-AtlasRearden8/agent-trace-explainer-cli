[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-explainer"
version = "0.1.0"
description = "Pretty-print and explain agent/LLM tool-call transcripts (JSONL logs) as human-readable timelines: which tool ran, why, retries, and cost counts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["ai", "agents", "llm", "transcripts", "jsonl", "tool-calls", "ollama", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]

[project.scripts]
agent-trace = "agent_tracer.cli:main"

[tool.setuptools.packages.find]
include = ["agent_tracer*"]
